name: Deploy to cluster

on:
  push:
    branches:
      - main
    paths:
      - 'k8s/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.28.0'
      
      - name: Decode KUBECONFIG and deploy
        env:
          KUBE_DATA: ${{ secrets.KUBE_CONFIG_DATA }}
        run: |
          echo "$KUBE_DATA" | base64 -d > ./.gha-kubeconfig
          export KUBECONFIG=$PWD/.gha-kubeconfig
          echo "✅ Connected to cluster:"
          kubectl get namespaces
          
          echo "🔄 Syncing ArgoCD to deploy applications..."
          # Force ArgoCD to sync instead of directly applying
          kubectl patch application cb-project-apps -n argocd --type merge -p '{"metadata":{"annotations":{"argocd.argoproj.io/refresh":"hard"}}}' || echo "ArgoCD sync triggered"
          
          echo "✅ Deployment complete! ArgoCD will sync the changes."
      
      - name: Verify deployment
        env:
          KUBE_DATA: ${{ secrets.KUBE_CONFIG_DATA }}
        run: |
          export KUBECONFIG=$PWD/.gha-kubeconfig
          echo "📊 ArgoCD Application Status:"
          kubectl get applications -n argocd
          echo ""
          echo "📦 All Pods:"
          kubectl get pods -A | grep -v Running | grep -v Completed || echo "All pods running!"
