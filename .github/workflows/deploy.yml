name: Deploy to cluster

on:
  push:
    branches:
      - main
    paths:
      - 'k8s/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.33.0'

      - name: Decode KUBECONFIG and trigger ArgoCD sync
        env:
          KUBE_DATA: ${{ secrets.KUBE_CONFIG_DATA }}
        run: |
          echo "$KUBE_DATA" | base64 -d > ./.gha-kubeconfig
          export KUBECONFIG=$PWD/.gha-kubeconfig
          echo "Connected to cluster:"
          kubectl get namespaces

          echo "Triggering ArgoCD hard refresh..."
          kubectl patch application cb-project-apps -n argocd --type merge \
            -p '{"metadata":{"annotations":{"argocd.argoproj.io/refresh":"hard"}}}'

      - name: Wait for ArgoCD sync to complete
        env:
          KUBE_DATA: ${{ secrets.KUBE_CONFIG_DATA }}
        run: |
          export KUBECONFIG=$PWD/.gha-kubeconfig
          echo "Waiting for ArgoCD sync..."
          for i in $(seq 1 30); do
            STATUS=$(kubectl get application cb-project-apps -n argocd \
              -o jsonpath='{.status.sync.status}' 2>/dev/null || echo "Unknown")
            HEALTH=$(kubectl get application cb-project-apps -n argocd \
              -o jsonpath='{.status.health.status}' 2>/dev/null || echo "Unknown")
            echo "  Attempt $i/30 — Sync: $STATUS | Health: $HEALTH"
            if [ "$STATUS" = "Synced" ] && [ "$HEALTH" = "Healthy" ]; then
              echo "ArgoCD sync complete and healthy."
              exit 0
            fi
            sleep 10
          done
          echo "ERROR: ArgoCD did not reach Synced+Healthy within 5 minutes."
          kubectl get applications -n argocd
          exit 1

      - name: Verify deployment
        env:
          KUBE_DATA: ${{ secrets.KUBE_CONFIG_DATA }}
        run: |
          export KUBECONFIG=$PWD/.gha-kubeconfig
          echo "ArgoCD Application Status:"
          kubectl get applications -n argocd
          echo ""
          echo "Non-running pods (if any):"
          kubectl get pods -A | grep -v Running | grep -v Completed || echo "All pods running!"
