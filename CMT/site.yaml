---
# site.yaml - automatic k3s join using token read from bootstrap (or passed as extra-var)
# Assumes group_vars/all.yml contains k3s_version, k3s_url, expected_nodes, etc.
# Secrets (non-k3s sensitive values) should go in secrets.yaml and be encrypted with ansible-vault.

- name: Ensure host prerequisites (all hosts)
  hosts: all
  become: true
  gather_facts: yes
  tasks:
    - name: Wait for package manager (Debian/Ubuntu) to be available
      apt:
        update_cache: yes
      register: _apt
      until: _apt is succeeded
      retries: 6
      delay: 5

    - name: Install required OS packages
      apt:
        name:
          - curl
          - ca-certificates
          - jq
          - gnupg
          - apt-transport-https
          - netcat-openbsd
        state: present
        update_cache: yes

    - name: Ensure /usr/local/bin exists
      file:
        path: /usr/local/bin
        state: directory
        mode: '0755'

- name: Install k3s server on bootstrap (idempotent)
  hosts: control_bootstrap
  become: true
  gather_facts: yes
  vars:
    install_check_path: /usr/local/bin/k3s
  tasks:
    - name: Install k3s server on bootstrap if missing
      shell: >
        INSTALL_K3S_VERSION={{ k3s_version }}
        curl -sfL https://get.k3s.io | sh -s - server
        {{ '--cluster-init' if cluster_init | default(false) else '' }}
        --node-name {{ inventory_hostname }}
        {{ "--node-taint 'node-role.kubernetes.io/control-plane=:NoSchedule'" if taint_control_nodes | default(true) else '' }}
      args:
        creates: "{{ install_check_path }}"

    - name: Ensure k3s service is active on bootstrap
      include_tasks: tasks/ensure_k3s_service.yml

    - name: Wait for server kubeconfig to appear
      stat:
        path: /etc/rancher/k3s/k3s.yaml
      register: kubeconfig_stat
      retries: 30
      delay: 3
      until: kubeconfig_stat.stat.exists

- name: Expose k3s join token for the play run (from extra-var or by reading bootstrap)
  hosts: control_bootstrap
  become: true
  gather_facts: no
  tasks:
    - name: Add bootstrap_vars host if k3s_token provided as extra-var
      add_host:
        name: bootstrap_vars
        groups: k3s_vars
        k3s_token: "{{ k3s_token }}"
      when: (k3s_token is defined) and (k3s_token | length) > 0
      run_once: true

    - name: Read the k3s node-token from disk (only when not provided via extra-vars)
      slurp:
        src: /var/lib/rancher/k3s/server/node-token
      register: node_token_b64
      when: k3s_token is not defined or (k3s_token | length) == 0
      failed_when: node_token_b64 is failed

    - name: Add helper host with k3s_token from bootstrap file if not provided externally
      add_host:
        name: bootstrap_vars
        groups: k3s_vars
        k3s_token: "{{ node_token_b64.content | b64decode | trim }}"
      when: k3s_token is not defined or (k3s_token | length) == 0
      run_once: true

- name: Join additional control plane nodes
  hosts: controls
  become: true
  gather_facts: yes
  vars:
    install_check_path: /usr/local/bin/k3s
  tasks:
    - name: Fail if k3s_token was not retrieved
      fail:
        msg: "k3s_token was not found. Provide it via --extra-vars k3s_token=... or ensure it exists on the bootstrap server."
      when: hostvars['bootstrap_vars'].k3s_token is not defined or (hostvars['bootstrap_vars'].k3s_token | length) == 0

    - name: Install k3s server (join to existing control) if missing
      shell: >
        INSTALL_K3S_VERSION={{ k3s_version }}
        K3S_URL={{ k3s_url }} K3S_TOKEN={{ hostvars['bootstrap_vars'].k3s_token }}
        curl -sfL https://get.k3s.io | sh -s - server
        --node-name {{ inventory_hostname }}
        {{ "--node-taint 'node-role.kubernetes.io/control-plane=:NoSchedule'" if taint_control_nodes | default(true) else '' }}
      args:
        creates: "{{ install_check_path }}"

    - name: Ensure k3s service is active on this control
      include_tasks: tasks/ensure_k3s_service.yml

- name: Join worker nodes (agents)
  hosts: workers
  become: true
  gather_facts: yes
  vars:
    install_check_path: "/usr/local/bin/k3s"
  tasks:
    - name: Fail if k3s_token was not retrieved
      fail:
        msg: "k3s_token was not found. Provide it via --extra-vars k3s_token=... or ensure it exists on the bootstrap server."
      when: hostvars['bootstrap_vars'].k3s_token is not defined or (hostvars['bootstrap_vars'].k3s_token | length) == 0

    - name: Install k3s agent if missing
      shell: >
        INSTALL_K3S_VERSION={{ k3s_version }}
        K3S_URL={{ k3s_url }} K3S_TOKEN={{ hostvars['bootstrap_vars'].k3s_token }}
        curl -sfL https://get.k3s.io | sh -s -
      args:
        creates: /usr/local/bin/k3s

    - name: Ensure k3s-agent service is active on this worker
      include_tasks: tasks/ensure_k3s_service.yml

- name: Wait until expected number of nodes are Ready
  hosts: control_bootstrap
  become: true
  gather_facts: no
  tasks:
    - name: Wait for all nodes to reach Ready state
      shell: |
        kubectl --kubeconfig /etc/rancher/k3s/k3s.yaml get nodes           --no-headers | grep -c " Ready"
      register: ready_count
      retries: "{{ node_ready_retries }}"
      delay: "{{ node_ready_delay }}"
      until: ready_count.stdout | int >= expected_nodes | int
      changed_when: false

    - name: Show final node status
      shell: kubectl --kubeconfig /etc/rancher/k3s/k3s.yaml get nodes
      register: node_status
      changed_when: false

    - name: Print node status
      debug:
        msg: "{{ node_status.stdout_lines }}"
