{{- if .Values.database.enabled }} # if database is enabled, create a service. Actual values are in values.yaml.
apiVersion: v1
kind: Service
metadata : # metadata for the service
  name: {{ include "plan-it.fullname" . }}-database # name of the service
  labels:
    {{- include "plan-it.labels" . | nindent 4 }}
    component: database 
spec:
  type: {{ .Values.database.service.type }} 
  ports:
    - port: {{ .Values.database.service.port }}
      targetPort: {{ .Values.database.service.targetPort }}
      protocol: TCP
      name: sqlserver
  selector:
    {{- include "plan-it.selectorLabels" . | nindent 4 }}
    component: database
{{- end }}

