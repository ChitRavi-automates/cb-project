global:
  imageRegistry: ""
  namespace: "chitra-plan-it"
  domain: "chitra-plan-it.chitra.doe24.chas-lab.dev"

app:
  name: "chitra-plan-it"
  environment: "production"

security:
  jwt:
    issuer: "chitra-plan-it"
    audience: "plan-it-users"
    # key is stored in sealed secret: chitra-plan-it-app-secrets

frontend:
  enabled: true
  replicaCount: 1
  image:
    repository: "ghcr.io/chitravi-automates/plan-it-frontend"
    tag: "latest"
    pullPolicy: Always
  service:
    name: "chitra-plan-it-frontend"
    port: 80
    targetPort: 80
    type: ClusterIP
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "200m"
      memory: "256Mi"

backend:
  enabled: true
  replicaCount: 1
  image:
    repository: "ghcr.io/chitravi-automates/plan-it-backend"
    tag: "latest"
    pullPolicy: Always
  service:
    name: "chitra-plan-it-backend"
    port: 80
    targetPort: 80
    type: ClusterIP
  env:
    ASPNETCORE_ENVIRONMENT: "Production"
    ASPNETCORE_URLS: "http://+:80"
  resources:
    requests:
      cpu: "150m"
      memory: "256Mi"
    limits:
      cpu: "300m"
      memory: "512Mi"

database:
  enabled: true
  replicaCount: 1
  type: "sqlserver"
  image:
    repository: "mcr.microsoft.com/mssql/server"
    tag: "2022-latest"
    pullPolicy: IfNotPresent
  service:
    name: "chitra-plan-it-database"
    port: 1433
    targetPort: 1433
    type: ClusterIP
  persistence:
    enabled: true
    size: 2Gi
    storageClass: "local-path"
  auth:
    username: "sa"
    database: "PlanItDb"
    # saPassword is stored in sealed secret: chitra-plan-it-app-secrets
    secretName: "chitra-plan-it-app-secrets"
  env:
    ACCEPT_EULA: "Y"
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "1Gi"

imagePullSecrets: []

ingress:
  enabled: true
  className: "traefik"
  annotations:
    kubernetes.io/ingress.class: "traefik"
    cert-manager.io/cluster-issuer: "letsencrypt-wildcard"
  hosts:
    - host: "chitra-plan-it.chitra.doe24.chas-lab.dev"
      paths:
        - path: "/api"
          pathType: Prefix
          service: backend
        - path: "/"
          pathType: Prefix
          service: frontend
  tls:
    - secretName: "chitra-plan-it-wildcard-tls"
      hosts:
        - "*.chitra.doe24.chas-lab.dev"

cicd:
  deployOnPush: true
