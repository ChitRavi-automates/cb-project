apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-wildcard
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: chitra.balasubramanian@chasacademy.se
    privateKeySecretRef:
      name: letsencrypt-wildcard-key
    solvers:
      - dns01:
          acmeDNS:
            host: https://auth.acme-dns.io
            accountSecretRef:
              name: acmedns-account
              key: acmedns.json
