loki-stack:
  loki:
    enabled: true
    persistence:
      enabled: true
      storageClassName: local-path
      size: 5Gi
    config:
      limits_config:
        retention_period: 7d
      table_manager:
        retention_deletes_enabled: true
        retention_period: 168h
  promtail:
    enabled: true
    config:
      clients:
        - url: http://logging-loki.logging.svc.cluster.local:3100/loki/api/v1/push
  grafana:
    enabled: false
    sidecar:
      datasources:
        enabled: true
